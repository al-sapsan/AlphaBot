name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e src/alpha_bot_driver || true
      
      - name: Run tests
        run: |
          pytest tests/ || echo "No tests yet"
      
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/alpha_bot_driver/ --count --max-line-length=120 --statistics || true
